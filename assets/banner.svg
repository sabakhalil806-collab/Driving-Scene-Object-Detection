<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Driving Scene Detection and Tracking - OpenCV, YOLOv8n, ByteTrack" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="14" fill="url(#bg)"/>
  <!-- road lane markings -->
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round">
    <line x1="60" y1="196" x2="150" y2="196"/>
    <line x1="210" y1="196" x2="300" y2="196"/>
    <line x1="360" y1="196" x2="450" y2="196"/>
    <line x1="510" y1="196" x2="600" y2="196"/>
    <line x1="660" y1="196" x2="750" y2="196"/>
    <line x1="810" y1="196" x2="900" y2="196"/>
    <line x1="960" y1="196" x2="1050" y2="196"/>
  </g>
  <!-- detection boxes -->
  <g fill="none" stroke-width="3">
    <rect x="70" y="40" width="130" height="80" rx="4" stroke="#00e5ff"/>
    <rect x="1000" y="50" width="130" height="75" rx="4" stroke="#ffb300"/>
  </g>
  <text x="76" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#00e5ff">car 0.87</text>
  <text x="1006" y="44" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#ffb300">truck 0.74</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Driving Scene Detection &amp; Tracking</text>
  <text x="600" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#b0e0f0" letter-spacing="2">OpenCV  |  YOLOv8n  |  ByteTrack</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
